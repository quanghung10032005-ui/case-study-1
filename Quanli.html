<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        margin: 0;
        padding: 0;
        background-color: #f5f5f5;
    }
    #title{
        font-size: 36px;
        margin-bottom: 20px;
        display:inline-block;
        margin-right: 95vh;
        align-items: left;
        margin-left: 100px;
        font-family: Arial, sans-serif;
        font-size: 48px;
        color: #333;
    }
    #div_chucnang{
        margin-left: 100px;
    }
    #div_chucnang button{
        margin: 10px;
        font-size: 16px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        padding: 10px 40px;
        background-color: #007bff;
        color: white;
        font-weight: bold;
        font-family: Arial, sans-serif; 
        width: 300px;
    }
    #div_chucnang button:hover{
        background-color: #0056b3; 
    }
    div#hienthi{
        border: 2px solid blanchedalmond; 
        background-color: aliceblue;
        border-radius: 10px;
        margin: 20px;
        padding: 20px;
    }
</style>
<body>
    <div id="hienthi">
    <div id="title">Trang quản lý</div>
    <div id="div_chucnang">
        <button type="button" onclick="hienThiQuanLyTaiKhoan()">Quản lý tài khoản</button><br>

        <button type="button" onclick="hienThiQuanLySanPham()">Quản lý sản phẩm</button><br>
        <button type="button" onclick="dangxuat()">Đăng xuất</button>
    </div>
    <div ></div>
</div>
<script>
    function hienThiQuanLyTaiKhoan(){
        document.getElementById("hienthi").innerHTML=window.location.href="taikhoan.html";
    }
    function hienThiQuanLySanPham(){
        document.getElementById("hienthi").innerHTML=window.location.href="sanpham.html";
    }
    function dangxuat(){
        window.location.href="Login.html";
    }

</script>
</body>
</html>
