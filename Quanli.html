<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        background: linear-gradient(135deg, #eff6ff, #f8fafc 55%, #ecfdf5);
        color: #1f2937;
        font-family: Arial, sans-serif;
    }

    #hienthi {
        width: 100%;
        max-width: 620px;
        padding: 42px;
        border: 1px solid #e5eaf2;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 16px 40px rgba(31, 41, 55, 0.1);
    }

    #title {
        margin-bottom: 28px;
        color: #1d4ed8;
        font-size: 34px;
        font-weight: 700;
        text-align: center;
    }

    #div_chucnang {
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: 100%;
    }

    #div_chucnang br {
        display: none;
    }

    #div_chucnang button {
        width: 100%;
        padding: 15px 20px;
        border: 1px solid #2563eb;
        border-radius: 9px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
        font: bold 16px Arial, sans-serif;
        transition: background-color 0.2s ease, transform 0.2s ease;
    }

    #div_chucnang button:hover {
        transform: translateY(-2px);
        background: #1d4ed8;
    }

    #div_chucnang button:last-child {
        margin-top: 6px;
        border-color: #e5e7eb;
        background: #f3f4f6;
        color: #374151;
    }

    #div_chucnang button:last-child:hover {
        background: #e5e7eb;
    }

    @media (max-width: 480px) {
        body {
            padding: 16px;
        }

        #hienthi {
            padding: 30px 22px;
        }

        #title {
            font-size: 30px;
        }
    }
</style>
<body>
    <div id="hienthi">
    <div id="title">Trang quản lý</div>
    <div id="div_chucnang">
        <button type="button" onclick="hienThiQuanLyTaiKhoan()">Quản lý tài khoản</button><br>

        <button type="button" onclick="hienThiQuanLySanPham()">Quản lý sản phẩm</button><br>
        <button type="button" onclick="dangxuat()">Đăng xuất</button>
    </div>
    <div ></div>
</div>
<script>
    function hienThiQuanLyTaiKhoan(){
        document.getElementById("hienthi").innerHTML=window.location.href="taikhoan.html";
    }
    function hienThiQuanLySanPham(){
        document.getElementById("hienthi").innerHTML=window.location.href="sanpham.html";
    }
    function dangxuat(){
        window.location.href="Login.html";
    }

</script>
</body>
</html>
