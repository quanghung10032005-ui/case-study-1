<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="Login.js"></script>
</head>
<style>
    body{
        margin: 0;
        padding: 0;
        background-color: #f5f5f5;
    }
    #title{
        font-size: 36px;
        margin-bottom: 10px;      
        align-items: center;
        font-family: Arial, sans-serif;
        font-size: 48px;
        color: #333;
    }
    #form_dangnhap{
        border: 1px solid rgb(207, 248, 227); 
        background-color: aliceblue;
        border-radius: 10px;
        padding: 70px;
        width : 400px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: auto;
        margin-top: 100px;
        
    }
    label{
        font-family: Arial, sans-serif;
        color: #333;
    }
    input[type="text"], input[type="password"]{
        width: 30vh;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background-color: rgb(214, 249, 231);
    }
    #div_btn{
        text-align: center;
    }
    #loginbtn, #registerbtn, #backbtn{
        margin: 10px;
        font-size: 16px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        padding: 10px 40px;
        background-color: #007bff;
        color: white;
        font-weight: bold;
        font-family: Arial, sans-serif; 
    }
    #loginbtn:hover, #registerbtn:hover, #backbtn:hover{
        background-color: #0056b3; 
    }
    label{
    font-family: Arial, sans-serif;
    color: #333;
    font-size: 16px;
    }
    
</style>

<body>
    
    
    <form id="form_dangnhap">
        <div id="title">Đăng nhập</div>
        <div>
            <label >Tên đăng nhập</label><br>
            <input type="text" name="tendangnhap" id="tendangnhap" placeholder="--Nhập tên đăng nhập--"><br>
            <label >Mật khẩu</label><br>
            <input type="password" name="matkhau" id="matkhau" placeholder="--Nhập mật khẩu--"><br>
        </div>
        <div id="div_btn">
            <button type="button"  onclick="dangNhap()" id="loginbtn">
                Đăng nhập
            </button>
            <button type="button" onclick="dangki()" id="registerbtn">
                Đăng ký
            </button><br>
            <button type="button" id="backbtn"  onclick="quaylai()">Quay lại</button><br>
            <a href="#" id="forgot-password">Quên mật khẩu?</a>
        </div>
    </form>
    <script>
        let users=JSON.parse(localStorage.getItem("danhsachUser")) || [];  
        if (users===null || users.length === 0) {
            let admin = new User("admin", "admin123", "admin");
            users.push(admin);
            localStorage.setItem("danhsachUser",JSON.stringify(users));
        }
            
        function quaylai() {
            window.location.href="trangchu.html";
        }
        function dangki(){
            window.location.href="Register.html";
        }
        function dangNhap(){
            let tendangnhap=document.getElementById("tendangnhap").value;
            let matkhau=document.getElementById("matkhau").value;
            for(let i=0;i<users.length;i++){
                if(users[i].username === tendangnhap && users[i].password === matkhau &&users[i].chucvu==="admin"){
                    alert("Đăng nhập thành công!");
                    window.location.href="Quanli.html";
                    return;
                }
                
            }
            alert("Tên đăng nhập hoặc mật khẩu không đúng!");
        }
        document.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                event.preventDefault(); 
                dangNhap(); 
            }
        });
    </script>
        
</body>
</html>
