<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="Login.js"></script>
</head>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        margin: 0;
        padding: 32px 20px;
        background: #f3f6fb;
        color: #1f2937;
        font-family: Arial, sans-serif;
    }

    #tongthe {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        min-height: calc(100vh - 64px);
    }

    #title {
        width: min(1200px, 100%);
        margin: 0 auto 22px;
        color: #1e3a8a;
        font-size: 32px;
        font-weight: 700;
    }

    #listtaikhoan {
        width: min(1200px, 100%);
        padding: 20px;
        overflow-x: auto;
        border: 1px solid #e5eaf2;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 8px 26px rgba(31, 41, 55, 0.07);
    }

    table {
        width: 100%;
        min-width: 640px;
        border-collapse: separate;
        border-spacing: 0;
        overflow: hidden;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
    }

    th,
    td {
        padding: 13px 15px;
        border-bottom: 1px solid #e5e7eb;
        color: #374151;
        text-align: left;
        vertical-align: middle;
    }

    th {
        background: #eff6ff;
        color: #1e3a8a;
        font-size: 14px;
        font-weight: 700;
        white-space: nowrap;
    }

    tbody tr:last-child td {
        border-bottom: none;
    }

    tbody tr:hover {
        background: #f8fafc;
    }

    .btn {
        margin: 4px;
        padding: 10px 18px;
        border: 1px solid #2563eb;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
        font: bold 14px Arial, sans-serif;
        transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .btn:hover {
        transform: translateY(-1px);
        background: #1d4ed8;
    }

    tbody td:nth-last-child(2) .btn {
        border-color: #fecaca;
        background: #fef2f2;
        color: #b91c1c;
    }

    tbody td:nth-last-child(2) .btn:hover {
        background: #fee2e2;
    }

    #tongthe > div[style*="justify-content: center"] {
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px !important;
    }

    #addform,
    #updateform {
        width: min(520px, 100%);
        margin: 20px auto 0;
        padding: 18px;
        border: 1px solid #e5eaf2;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 8px 26px rgba(31, 41, 55, 0.07);
    }

    fieldset {
        width: 100%;
        padding: 20px;
        border: 1px solid #e5eaf2;
        border-radius: 10px;
    }

    legend {
        padding: 0 8px;
        margin-bottom: 12px;
        color: #1e3a8a;
        font-size: 20px;
        font-weight: 700;
    }

    label {
        display: inline-block;
        margin-bottom: 7px;
        color: #374151;
        font-size: 14px;
        font-weight: 600;
    }

    input,
    select {
        width: 100%;
        margin-bottom: 14px;
        padding: 11px 13px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        outline: none;
        background: #f9fafb;
        color: #111827;
        font: inherit;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus,
    select:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    @media (max-width: 640px) {
        body {
            padding: 22px 14px;
        }

        #tongthe {
            min-height: calc(100vh - 44px);
        }

        #title {
            font-size: 27px;
        }

        #listtaikhoan {
            padding: 14px;
        }

        #addform,
        #updateform {
            padding: 12px;
        }

        fieldset {
            padding: 16px;
        }
    }
</style>
<body>
    <div id="tongthe">
    <div id="title">Quản lý tài khoản</div>
    <div id="listtaikhoan">
    
    
    <table border="1">
        <thead>
            <tr>
                <th>Tên đăng nhập</th>
                <th>Mật khẩu</th>
                <th>Vai trò</th>
                <th colspan="2">Thao tác</th>
            </tr>
        </thead>
        <tbody id="list_account" >

        </tbody>
        </div>
        </div>
    </table>
    <div style="display: flex; justify-content: center; margin-top: 20px;">
    <button type="button" class="btn" onclick="openaddform()">Thêm tài khoản</button>
    <button type="button" class="btn" onclick="location.href='Quanli.html'">Quay lại</button>
</div>
<form action="" id="addform" style="display: none;">
        <fieldset>
            <legend>Thêm tài khoản mới</legend>
        <label for="username">Tên đăng nhập:</label><br>
        <input type="text" id="username" name="username" placeholder="--Nhập tên đăng nhập--"><br>
        <label for="password">Mật khẩu:</label><br>
        <input type="password" id="password" name="password" placeholder="--Nhập mật khẩu--"><br>
        <label for="chucvu">Chức vụ:</label><br>
        <select id="chucvu" name="chucvu">
            <option value="">--Chọn chức vụ--</option>
            <option value="admin">Admin</option>
            <option value="user">User</option>
        </select><br>
        <button type="button" class="btn" onclick="add()">Thêm tài khoản</button>
        <button type="button" class="btn" onclick="closeaddform()">Đóng</button>
        </fieldset>
    </form>
    <form action="" id="updateform" style="display: none;">
        <fieldset>
                <legend>Cập nhật tài khoản</legend>
            <label for="username">Tên đăng nhập:</label><br>
            <input type="text" id="updatename" name="name" placeholder="--Nhập tên đăng nhập--"><br>
            <label for="password">Mật khẩu:</label><br>
            <input type="password" id="updatepassword" name="password" placeholder="--Nhập mật khẩu--"><br>
            <label for="chucvu">Chức vụ:</label><br>
            <select id="updatechucvu" name="chucvu">
                <option value="">--Chọn chức vụ--</option>
                <option value="admin">Admin</option>
                <option value="user">User</option>
            </select><br>
            <button type="button" class="btn" onclick="update(currentSelect)">Cập nhật tài khoản</button>
            <button type="button" class="btn" onclick="closeupdateform()">Đóng</button>
        </fieldset>
    </form>
    <script>
        let currentSelect=-1;
        let users=JSON.parse(localStorage.getItem("danhsachUser")) || [];
        function hienThiQuanLyTaiKhoan(){
            let str = "";
            for(let i=0;i<users.length;i++){
                str += `
                    <tr>
                        <td>${users[i].username}</td>
                        <td>${users[i].password}</td>
                        <td>${users[i].chucvu}</td>
                        <td><button type="button" class="btn" onclick="deletedata(${i})">Xóa</button></td>
                        <td><button type="button" class="btn" onclick="sua(${i})">Sửa</button></td>
                        </tr>
                `;
            }
            document.getElementById("list_account").innerHTML = str;
        }
        function add(){
            let name=document.getElementById("username").value;
            let password=document.getElementById("password").value;
            let chucvu=document.getElementById("chucvu").value;
            if(name==""||password==""||chucvu==""){
                alert("Vui lòng điền đầy đủ thông tin!");
                return;
            }
            for(let i=0;i<users.length;i++){
                if(users[i].username === name){
                    alert("Tên đăng nhập đã tồn tại!");
                    return;
                }
            }
            let newUser=new User(name,password,chucvu);
            users.push(newUser);
            localStorage.setItem("danhsachUser",JSON.stringify(users));
            alert("Thêm tài khoản thành công!");
            document.getElementById("addform").style.display="none";
            hienThiQuanLyTaiKhoan();
        }
        function deletedata(index){
            if(confirm("Bạn có chắc muốn xóa tài khoản này?")) {
                users.splice(index,1);
                localStorage.setItem("danhsachUser",JSON.stringify(users));
                alert("Xóa tài khoản thành công!");
                hienThiQuanLyTaiKhoan();
            }
        }
        function sua(index){
            document.getElementById("updatename").value=users[index].username;
            document.getElementById("updatepassword").value=users[index].password;
            document.getElementById("updatechucvu").value=users[index].chucvu;
            document.getElementById("updateform").style.display="block";
            currentSelect=index;

        }
        function update(index){
            let name=document.getElementById("updatename").value;
            let password=document.getElementById("updatepassword").value;
            let chucvu=document.getElementById("updatechucvu").value;
            if(name==""||password==""||chucvu==""){
                alert("Vui lòng điền đầy đủ thông tin!");
                return;
            }
            for(let i=0;i<users.length;i++){
                if(users[i].name==name ){
                    alert("Tên đăng nhập đã tồn tại!");
                    return;
                }
            let newUser=new User(name,password,chucvu);
            users[index]=newUser;
            localStorage.setItem("danhsachUser",JSON.stringify(users));
            alert("Cập nhật tài khoản thành công!");
            document.getElementById("updateform").reset();
            
            }
            hienThiQuanLyTaiKhoan();
        }
        function openaddform(){
            document.getElementById("addform").style.display="block";
        }
        function closeaddform(){
            document.getElementById("addform").style.display="none";
        }
        function closeupdateform(){
            document.getElementById("updateform").style.display="none";
        }
        hienThiQuanLyTaiKhoan();
        
    </script>
</body>
</html>
