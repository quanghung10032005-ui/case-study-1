<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="Login.js"></script>
</head>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        background: linear-gradient(135deg, #eff6ff, #f8fafc 55%, #ecfdf5);
        color: #1f2937;
        font-family: Arial, sans-serif;
    }

    #form_dangnhap {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 440px;
        margin: 0;
        padding: 40px;
        border: 1px solid #e5eaf2;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 16px 40px rgba(31, 41, 55, 0.1);
    }

    #title {
        margin-bottom: 28px;
        color: #1d4ed8;
        font-size: 34px;
        font-weight: 700;
        text-align: center;
    }

    #form_dangnhap > div:nth-child(2) {
        width: 100%;
    }

    label {
        display: inline-block;
        margin-bottom: 8px;
        color: #374151;
        font-size: 15px;
        font-weight: 600;
    }

    input[type="text"],
    input[type="password"] {
        width: 100%;
        margin-bottom: 20px;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        outline: none;
        background: #f9fafb;
        color: #111827;
        font: inherit;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    #div_btn {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
    }

    #div_btn br {
        display: none;
    }

    #loginbtn,
    #registerbtn,
    #backbtn {
        width: 100%;
        padding: 12px 18px;
        border: 1px solid #2563eb;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
        font: bold 15px Arial, sans-serif;
        transition: background-color 0.2s ease, transform 0.2s ease;
    }

    #registerbtn {
        background: #fff;
        color: #2563eb;
    }

    #backbtn {
        border-color: #e5e7eb;
        background: #f3f4f6;
        color: #374151;
    }

    #loginbtn:hover,
    #registerbtn:hover {
        transform: translateY(-1px);
        background: #1d4ed8;
        color: #fff;
    }

    #backbtn:hover {
        background: #e5e7eb;
    }

    #forgot-password {
        align-self: center;
        margin-top: 4px;
        color: #2563eb;
        font-size: 14px;
        text-decoration: none;
    }

    #forgot-password:hover {
        text-decoration: underline;
    }

    @media (max-width: 480px) {
        body {
            padding: 16px;
        }

        #form_dangnhap {
            padding: 30px 22px;
        }

        #title {
            font-size: 30px;
        }
    }
</style>

<body>
    
    
    <form id="form_dangnhap">
        <div id="title">Đăng nhập</div>
        <div>
            <label >Tên đăng nhập</label><br>
            <input type="text" name="tendangnhap" id="tendangnhap" placeholder="--Nhập tên đăng nhập--"><br>
            <label >Mật khẩu</label><br>
            <input type="password" name="matkhau" id="matkhau" placeholder="--Nhập mật khẩu--"><br>
        </div>
        <div id="div_btn">
            <button type="button"  onclick="dangNhap()" id="loginbtn">
                Đăng nhập
            </button>
            <button type="button" onclick="dangki()" id="registerbtn">
                Đăng ký
            </button><br>
            <button type="button" id="backbtn"  onclick="quaylai()">Quay lại</button><br>
            <a href="#" id="forgot-password">Quên mật khẩu?</a>
        </div>
    </form>
    <script>
        let users=JSON.parse(localStorage.getItem("danhsachUser")) || [];  
        if (users===null || users.length === 0) {
            let admin = new User("admin", "admin123", "admin");
            users.push(admin);
            localStorage.setItem("danhsachUser",JSON.stringify(users));
        }
            
        function quaylai() {
            window.location.href="index.html";
        }
        function dangki(){
            window.location.href="Register.html";
        }
        function dangNhap(){
            let tendangnhap=document.getElementById("tendangnhap").value;
            let matkhau=document.getElementById("matkhau").value;
            for(let i=0;i<users.length;i++){
                if(users[i].username === tendangnhap && users[i].password === matkhau &&users[i].chucvu==="admin"){
                    alert("Đăng nhập thành công!");
                    window.location.href="Quanli.html";
                    return;
                }
                
            }
            alert("Tên đăng nhập hoặc mật khẩu không đúng!");
        }
        document.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                event.preventDefault(); 
                dangNhap(); 
            }
        });
    </script>
        
</body>
</html>
