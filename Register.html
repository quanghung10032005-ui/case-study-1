<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="Login.js"></script>
</head>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        background: linear-gradient(135deg, #eff6ff, #f8fafc 55%, #ecfdf5);
        color: #1f2937;
        font-family: Arial, sans-serif;
    }

    #form_dangky {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 440px;
        margin: 0;
        padding: 40px;
        border: 1px solid #e5eaf2;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 16px 40px rgba(31, 41, 55, 0.1);
    }

    #title {
        margin-bottom: 28px;
        color: #1d4ed8;
        font-size: 34px;
        font-weight: 700;
        text-align: center;
    }

    #form_dangky > div:nth-child(2) {
        width: 100%;
    }

    label {
        display: inline-block;
        margin-bottom: 8px;
        color: #374151;
        font-size: 15px;
        font-weight: 600;
    }

    input[type="text"],
    input[type="password"] {
        width: 100%;
        margin-bottom: 18px;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        outline: none;
        background: #f9fafb;
        color: #111827;
        font: inherit;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    #div_btn {
        display: flex;
        gap: 10px;
        width: 100%;
        margin-top: 4px;
    }

    .btn {
        flex: 1;
        padding: 12px 16px;
        border: 1px solid #2563eb;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
        font: bold 15px Arial, sans-serif;
        transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .btn:first-child {
        border-color: #e5e7eb;
        background: #f3f4f6;
        color: #374151;
    }

    .btn:hover {
        transform: translateY(-1px);
        background: #1d4ed8;
        color: #fff;
    }

    @media (max-width: 480px) {
        body {
            padding: 16px;
        }

        #form_dangky {
            padding: 30px 22px;
        }

        #title {
            font-size: 30px;
        }

        #div_btn {
            flex-direction: column;
        }
    }
</style>
<body>
    
    <form id="form_dangky">
        <div id="title">Đăng ký</div>
        <div>
            <label >Tên đăng nhập</label><br>
            <input type="text" name="tendangnhap" id="tendangnhap" placeholder="--Nhập tên đăng nhập--"><br>
            <label >Mật khẩu</label><br>
            <input type="password" name="matkhau" id="matkhau" placeholder="--Nhập mật khẩu--"><br>
            <label >Xác nhận mật khẩu</label><br>
            <input type="password" name="xacnhanmatkhau" id="xacnhanmatkhau" placeholder="--Xác nhận mật khẩu--"><br>
        </div>
        <div id="div_btn">
            <button type="button" onclick="dangnhap()" class="btn">
                Đăng nhập
            </button>
            <button type="button" onclick="dangky()" class="btn">
                Đăng ký
            </button>
        </div>
    </form>
    <script>
        let users = JSON.parse(localStorage.getItem("danhsachUser")) || [];

        function dangky() {
            let tendangnhap = document.getElementById("tendangnhap").value;
            let matkhau = document.getElementById("matkhau").value;
            let xacnhanmatkhau = document.getElementById("xacnhanmatkhau").value;
            if(tendangnhap==""||matkhau==""||xacnhanmatkhau==""){
                alert("Vui lòng điền đầy đủ thông tin!");
                return;
            }

            if (matkhau !== xacnhanmatkhau) {
                alert("Mật khẩu và xác nhận mật khẩu không khớp!");
                return;
            }

            for (let i = 0; i < users.length; i++) {
                if (users[i].username === tendangnhap) {
                    alert("Tên đăng nhập đã tồn tại!");
                    return;
                }
            }

            let newUser=new User(tendangnhap, matkhau, "user");
            users.push(newUser);
            localStorage.setItem("danhsachUser",JSON.stringify(users));
            alert("Đăng ký thành công!");
            window.location.href="Login.html";
        }
        function dangnhap() {
            window.location.href="Login.html";
        }
    </script>
</body>
</html>
