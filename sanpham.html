<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="Product.js"></script>
</head>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        margin: 0;
        padding: 32px 20px;
        background: #f3f6fb;
        color: #1f2937;
        font-family: Arial, sans-serif;
    }

    #div_sanpham {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
    }

    #title {
        width: min(1200px, 100%);
        margin: 0 auto 22px;
        color: #1e3a8a;
        font-size: 32px;
        font-weight: 700;
    }

    #hienthi {
        width: min(1200px, 100%);
        padding: 24px;
        overflow-x: auto;
        border: 1px solid #e5eaf2;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 8px 26px rgba(31, 41, 55, 0.07);
    }

    table {
        width: 100%;
        min-width: 760px;
        border-collapse: separate;
        border-spacing: 0;
        overflow: hidden;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
    }

    th,
    td {
        padding: 13px 14px;
        border-bottom: 1px solid #e5e7eb;
        text-align: left;
        vertical-align: middle;
    }

    th {
        background: #eff6ff;
        color: #1e3a8a;
        font-size: 14px;
        font-weight: 700;
        white-space: nowrap;
    }

    tbody tr:last-child td {
        border-bottom: none;
    }

    tbody tr:hover {
        background: #f8fafc;
    }

    .btn {
        margin: 5px;
        padding: 10px 18px;
        border: 1px solid #2563eb;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
        font: bold 14px Arial, sans-serif;
        transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .btn:hover {
        transform: translateY(-1px);
        background: #1d4ed8;
    }

    tbody .btn {
        margin: 2px;
        padding: 7px 11px;
        font-size: 13px;
    }

    tbody td:nth-last-child(2) .btn {
        border-color: #fecaca;
        background: #fef2f2;
        color: #b91c1c;
    }

    tbody td:nth-last-child(2) .btn:hover {
        background: #fee2e2;
    }

    #div_form {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 18px;
        margin-top: 20px;
    }

    #addform,
    #updateform {
        width: min(500px, 100%);
    }

    fieldset {
        width: 100%;
        padding: 22px;
        border: 1px solid #e5eaf2;
        border-radius: 12px;
        background: #fff;
    }

    legend {
        padding: 0 8px;
        color: #1e3a8a;
        font-size: 18px;
        font-weight: 700;
    }

    input {
        width: 100%;
        margin-bottom: 12px;
        padding: 11px 13px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        outline: none;
        background: #f9fafb;
        color: #111827;
        font: inherit;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    #hienthi > div[style*="justify-content: center"] {
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 18px !important;
    }

    @media (max-width: 700px) {
        body {
            padding: 22px 14px;
        }

        #title {
            font-size: 27px;
        }

        #hienthi {
            padding: 16px;
        }

        #div_form {
            flex-direction: column;
        }

        #addform,
        #updateform {
            width: 100%;
        }
    }
</style>
<body>
    <div id="div_sanpham">
    <div id="title">Quản lý sản phẩm</div>
    <div id="hienthi">
        
        <table border="1">
            <thead>
                <tr>
                    <th>Mã sản phẩm</th>
                    <th>Tên sản phẩm</th>
                    <th>Giá</th>
                    <th>Số lượng</th>
                    <th>Mô tả</th>
                    <th colspan="2">Thao tác</th>
                </tr>
            </thead>
            <tbody id="listsanpham">
                
            </tbody>
        </table>
      <div id="div_form"> 
    <form action="" id="addform" style="display: none;">
            <fieldset>
                <legend>Thông tin sản phẩm</legend>
                <input type="text" id="ma" placeholder="Mã sản phẩm"><br>
                <input type="text" id="ten" placeholder="Tên sản phẩm"><br>
                <input type="number" id="gia" placeholder="Giá"><br>
                <input type="number" id="soluong" placeholder="Số lượng"><br>
                <input type="text" id="mota" placeholder="Mô tả"><br>
                <button class="btn" type="button" onclick="add()">Thêm sản phẩm</button>
                <button class="btn" type="button" onclick="closeaddform()">Đóng</button>
            </fieldset>
            
        </form>
        <form action="" id="updateform" style="display: none;">
            <fieldset>
                <legend>Chỉnh sửa sản phẩm</legend>
                <input type="text" id="updatema" placeholder="Mã sản phẩm"><br>
                <input type="text" id="updateten" placeholder="Tên sản phẩm"><br>
                <input type="number" id="updategia" placeholder="Giá"><br>
                <input type="number" id="updatesoluong" placeholder="Số lượng"><br>
                <input type="text" id="updatemota" placeholder="Mô tả"><br>
                <button class="btn" type="button" onclick="update(currentSelect)">Lưu thay đổi</button>
                <button class="btn" type="button" onclick="closeupdateform()">Đóng</button>
            </fieldset>
        </form>
        </div> 
        <div style="display: flex; justify-content: center; margin-top: 10px;">
            <button class="btn" type="button" onclick="openaddform()">Thêm sản phẩm</button>
            <button class="btn" type="button" onclick="quaylai()">Quay lại</button>
            </div>
    </div>
</div>
    <script>
        let currentSelect=-1;
        let products=JSON.parse(localStorage.getItem("products")) || [];
        if(products.length==0){
        let product1=new Product("SP001","iPhone 17 Pro Max",30000000,100,"Điện thoại cao cấp của Apple");
        let product2=new Product("SP002","iPhone 16 Pro Max",25000000,150,"Điện thoại cao cấp của Apple");
        let product3=new Product("SP003","iPhone 14 Pro Max",20000000,200,"Điện thoại cao cấp của Apple");
        let product4=new Product("SP004","iPhone 13 Pro Max",15000000,250,"Điện thoại cao cấp của Apple");
        products.push(product1, product2, product3, product4);
        localStorage.setItem("products",JSON.stringify(products));
        }
        let listsanpham=document.getElementById("listsanpham");
        function hienthisanpham(){
            let str="";
            for(let i=0;i<products.length;i++){
                str+=`<tr>
                    <td>${products[i].ma}</td>
                    <td>${products[i].ten}</td>
                    <td>${products[i].gia}</td>
                    <td>${products[i].soluong}</td>
                    <td>${products[i].mota}</td>
                    <td><button class="btn" type="button" onclick="deletedata(${i})">Xóa</button></td>
                    <td><button class="btn" type="button" onclick="sua(${i})">Sửa</button></td>
                </tr>`;
            }
            listsanpham.innerHTML=str;
        }
        function add(){
            let ma=document.getElementById("ma").value;
            let ten=document.getElementById("ten").value;
            let gia=document.getElementById("gia").value;
            let soluong=document.getElementById("soluong").value;
            let mota=document.getElementById("mota").value;
            if(ma==""||ten==""||gia==""||soluong==""||mota==""){
                alert("Vui lòng điền đầy đủ thông tin!");
                return;
            }
            let newProduct=new Product(ma,ten,gia,soluong,mota);
            products.push(newProduct);
            localStorage.setItem("products",JSON.stringify(products));
            alert("Thêm sản phẩm thành công!");
            hienthisanpham();
        }
        function deletedata(index){
            if(confirm("Bạn có chắc muốn xóa sản phẩm này?")){  
            products.splice(index,1);
            localStorage.setItem("products",JSON.stringify(products));
            alert("Xóa sản phẩm thành công!");
            hienthisanpham();
        }
    }
        function sua(index){
            currentSelect=index;
            document.getElementById("updatema").value=products[index].ma;
            document.getElementById("updateten").value=products[index].ten;
            document.getElementById("updategia").value=products[index].gia;
            document.getElementById("updatesoluong").value=products[index].soluong;
            document.getElementById("updatemota").value=products[index].mota;
            document.getElementById("updateform").style.display="block";
        }
        function update(index){
            let ma=document.getElementById("updatema").value;
            let ten=document.getElementById("updateten").value;
            let gia=document.getElementById("updategia").value;
            let soluong=document.getElementById("updatesoluong").value;
            let mota=document.getElementById("updatemota").value;
            if(ma==""||ten==""||gia==""||soluong==""||mota==""){
                alert("Vui lòng điền đầy đủ thông tin!");
                return;
            }
            let newproduct=new Product(ma,ten,gia,soluong,mota);
            products[index]=newproduct;
            localStorage.setItem("products",JSON.stringify(products));
            alert("Cập nhật sản phẩm thành công!");
            document.getElementById("updateform").style.display="none";
            hienthisanpham();
        }
        function closeaddform(){
            document.getElementById("addform").style.display="none";
        }
        function quaylai(){
            window.location.href="Quanli.html";
        }
        function openaddform(){
            document.getElementById("addform").style.display="block";
        }
        function closeupdateform(){
            document.getElementById("updateform").style.display="none";
        }
        hienthisanpham();
    </script>
</body>
</html>
